hsdp_dim: 1
logging:
  project: "debug"
  entity: "debug"
  use_wandb: false
  log_every_k: 1
dataset:
  resolution: 256
  use_aug: false
  use_latent: false
  use_cache: true
  num_classes: 1000
  batch_size: 64
  eval_batch_size: 64
  kwargs:
    num_workers: 0
    pin_memory: false
model:
  cond_dim: 384
  input_size: 32
  in_channels: 4
  patch_size: 2
  hidden_size: 384
  depth: 4
  num_heads: 6
  mlp_ratio: 4.0
  out_channels: 4
  use_qknorm: true
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  n_cls_tokens: 4
  noise_classes: 16
  noise_coords: 8
  use_bf16: true
  attn_fp32: true
optimizer:
  lr_schedule:
    learning_rate: 0.0002
    warmup_steps: 100
    lr_schedule: "const"
    total_steps: 200
  weight_decay: 0.01
  adam_b1: 0.9
  adam_b2: 0.95
train:
  train_batch_size: 8
  seed: 42
  total_steps: 20
  save_per_step: 100000
  keep_every: 100000
  eval_per_step: 100000
  pos_per_sample: 16
  neg_per_sample: 8
  positive_bank_size: 64
  negative_bank_size: 256
  forward_dict:
    gen_per_label: 8
    cfg_min: 1.0
    cfg_max: 4.0
    neg_cfg_pw: 3.0
  activation_kwargs:
    patch_mean_size: [2, 4]
    patch_std_size: [2, 4]
    use_std: true
    use_mean: true
    every_k_block: 2
  loss_kwargs:
    R_list: [0.2, 0.05, 0.02]
  cfg_list: [1.0]
  ema_decay: 0.999
  push_per_step: 8
feature:
  mae_path: "hf://mae_latent_256"
  use_mae: true
  use_convnext: false
